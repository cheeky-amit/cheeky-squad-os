name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install portability test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff lint and format
        run: |
          ruff check src tests/python
          ruff format --check src tests/python

      - name: Python contracts, adapters, exports, and generated packages
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests/python

      - name: Scan tracked source and fixtures for credential material
        run: bash tests/secret-scan.sh

  shell:
    name: shellcheck + bats
    runs-on: ubuntu-latest
    env:
      # Pinned so CI and local runs use the SAME analyzer — distro-packaged
      # shellcheck versions differ in which checks they emit (e.g. SC2015).
      SHELLCHECK_VERSION: v0.10.0
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Install pinned ShellCheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck the shipped shell scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          shellcheck hooks/*.sh skills/**/scripts/*.sh tests/*.sh

      - name: Run bats suites
        # Glob, not an explicit list: a new tests/*.bats suite must never be
        # silently unwired from CI by someone forgetting to add it here.
        run: bats tests/*.bats

      - name: Lint mermaid sequence diagrams
        # Four diagrams in this repo had never rendered. Structural check, not
        # a real render: CI here is shellcheck + bats and finishes in ~25s;
        # pulling Chromium in to render diagrams would cost minutes for a class
        # of bug this catches for free.
        run: bash tests/mermaid-lint.sh

      - name: Syntax-check the workflow dispatch template
        # templates/squad-dispatch.workflow.js is shipped JavaScript that CI
        # never parsed. A syntax error would only surface at dispatch time.
        run: node --check templates/squad-dispatch.workflow.js

      - name: Lint example rosters against the canonical schema
        shell: bash
        run: |
          # Every fenced json block that declares "roles" — in the examples and
          # the shipped template — must conform to the roster schema the
          # permission hook and spawn path actually read. Invented keys
          # silently disable the hook, so they fail CI.
          set -euo pipefail
          fail=0
          for f in examples/*.md; do
            blocks=$(awk '/^```json/{b=1;next} /^```/{if(b){print "\x1e"} b=0;next} b{print}' "$f")
            n=0
            while IFS= read -r -d $'\x1e' block; do
              printf '%s' "$block" | jq -e 'has("roles")' >/dev/null 2>&1 || continue
              n=$((n+1))
              if ! printf '%s' "$block" | jq -e '
                  def only($allowed): ((keys_unsorted - $allowed) | length) == 0;
                  def legacy:
                    only(["squad_goal_ref","mode","created","roles"]) and
                    has("squad_goal_ref") and has("mode") and
                    (.roles | all(
                      only(["name","purpose","agent_file","role_goal","file_scope","tools","model","effort","active","created","environment"]) and
                      has("name") and has("purpose") and has("agent_file") and
                      has("role_goal") and has("file_scope") and has("tools") and
                      has("model") and has("active")));
                  def v2:
                    only(["schema_version","squad_goal_ref","execution_mode","created","roles"]) and
                    .schema_version == 2 and has("squad_goal_ref") and has("execution_mode") and
                    (.roles | all(
                      only(["id","purpose","description","file_ownership","capabilities","reasoning","active","goal_ref","created","environment","provider_overrides"]) and
                      has("id") and has("purpose") and has("description") and
                      has("file_ownership") and has("capabilities") and has("reasoning") and
                      has("active") and
                      (.file_ownership | only(["include","exclude"])) and
                      (.reasoning | only(["profile","effort"]))));
                  legacy or v2' >/dev/null; then
                echo "::error file=$f::roster block #$n does not conform to the canonical roster schema"
                fail=1
              fi
            done < <(printf '%s\x1e' "$blocks")
          done
          jq -e '
            def only($allowed): ((keys_unsorted - $allowed) | length) == 0;
            only(["schema_version","squad_goal_ref","execution_mode","created","roles"]) and
            .schema_version == 2 and has("squad_goal_ref") and has("execution_mode") and
            (.roles | all(
              only(["id","purpose","description","file_ownership","capabilities","reasoning","active","goal_ref","created","environment","provider_overrides"]) and
              (.file_ownership | only(["include","exclude"])) and
              (.reasoning | only(["profile","effort"]))))' \
            templates/roster.json >/dev/null \
            || { echo "::error file=templates/roster.json::template is not canonical roster v2"; fail=1; }
          exit $fail
